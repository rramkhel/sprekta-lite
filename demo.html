<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprekta — API Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    header .tag {
      font-size: 11px;
      color: #888;
      background: #1a1a1a;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
    }

    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 720px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      color: #fff;
      padding: 12px 16px;
      background: #1a1a2e;
      border-radius: 12px;
      align-self: flex-end;
    }

    .message.assistant {
      color: #ccc;
      padding: 12px 0;
    }

    .message.assistant strong { color: #fff; }

    .message.system {
      color: #555;
      font-size: 13px;
      font-style: italic;
      text-align: center;
      align-self: center;
    }

    .thinking {
      color: #555;
      font-style: italic;
    }

    #input-area {
      padding: 16px 24px;
      border-top: 1px solid #222;
      display: flex;
      gap: 12px;
    }

    #input-area textarea {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      min-height: 48px;
      max-height: 200px;
      outline: none;
    }

    #input-area textarea:focus { border-color: #555; }

    #input-area textarea::placeholder { color: #555; }

    #input-area button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
    }

    #input-area button:hover { background: #ddd; }
    #input-area button:disabled { background: #333; color: #666; cursor: not-allowed; }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .controls button {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .controls button:hover { border-color: #555; color: #ccc; }
  </style>
</head>
<body>
  <header>
    <h1>Sprekta <span style="color: #555; font-weight: 400;">— API Test</span></h1>
    <div class="controls">
      <span class="tag" id="model-tag">loading...</span>
      <button onclick="clearChat()">Clear</button>
    </div>
  </header>

  <div id="chat-area">
    <div class="message system">
      System prompt loaded with Rachel's profile. Type anything — brain dump, quick capture, questions about your week.
    </div>
  </div>

  <div id="input-area">
    <textarea
      id="input"
      placeholder="Dump your chaos here..."
      rows="2"
      autofocus
    ></textarea>
    <button id="send-btn" onclick="send()">Send</button>
  </div>

  <script>
    const chatArea = document.getElementById('chat-area');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const modelTag = document.getElementById('model-tag');

    let messages = []; // conversation history for API

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    });

    // Enter to send, Shift+Enter for newline
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      // Add user message to UI
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      // Clear input
      input.value = '';
      input.style.height = 'auto';

      // Show thinking indicator
      const thinkingEl = addMessage('assistant', '...');
      thinkingEl.classList.add('thinking');

      // Disable input while waiting
      sendBtn.disabled = true;
      input.disabled = true;

      try {
        const res = await fetch('/api/demo-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'API error');

        // Replace thinking with actual response
        thinkingEl.textContent = data.reply;
        thinkingEl.classList.remove('thinking');

        // Add to conversation history
        messages.push({ role: 'assistant', content: data.reply });

        // Update model tag
        modelTag.textContent = 'sonnet 4';

      } catch (err) {
        thinkingEl.textContent = `Error: ${err.message}`;
        thinkingEl.style.color = '#ff4444';
        thinkingEl.classList.remove('thinking');
      }

      // Re-enable input
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();

      // Scroll to bottom
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addMessage(role, text) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.textContent = text;
      chatArea.appendChild(el);
      chatArea.scrollTop = chatArea.scrollHeight;
      return el;
    }

    function clearChat() {
      messages = [];
      chatArea.innerHTML = '<div class="message system">Chat cleared. Fresh start.</div>';
      input.focus();
    }

    // Focus input on load
    modelTag.textContent = 'sonnet 4';
  </script>
</body>
</html>
