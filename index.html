<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprekta - AI Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Auth Modal -->
    <div id="auth-modal" class="hidden"></div>

    <!-- Settings Container -->
    <div id="settings-container" class="hidden"></div>

    <!-- History Container -->
    <div id="history-container" class="hidden"></div>

    <!-- App Header -->
    <header class="app-header">
        <div class="header-left">
            <button id="toggle-chat" class="panel-toggle" aria-label="Toggle chat">
                <i data-lucide="message-square"></i>
            </button>
            <h1 class="app-title">Sprekta</h1>
        </div>
        <div class="header-center">
            <!-- Quick capture will stay here -->
        </div>
        <div class="header-right">
            <button id="toggle-triage" class="panel-toggle" aria-label="Toggle triage">
                <i data-lucide="inbox"></i>
            </button>
            <button id="profile-btn" class="profile-btn">
                <i data-lucide="user"></i>
            </button>
            <!-- Auth will render here -->
            <div id="auth-header"></div>
        </div>
    </header>

    <!-- Three-Panel App Shell -->
    <div id="app-shell" class="app-shell">
        <!-- Left: Chat Panel -->
        <div id="chat-panel" class="panel panel-left hidden">
            <div class="panel-header">
                <h3>Chat</h3>
                <button class="panel-close" data-panel="chat">×</button>
            </div>
            <div class="chat-panel-messages" id="chat-messages">
                <!-- Messages render here -->
            </div>
            <div class="chat-panel-input">
                <textarea
                    id="chat-input"
                    placeholder="What's on your mind?"
                    rows="2"
                ></textarea>
                <button id="chat-send" class="chat-send-btn">Send</button>
            </div>
        </div>

        <!-- Center: Calendar (always visible) -->
        <div id="calendar-panel" class="panel panel-center">
            <div class="calendar-view" id="calendarView">
                <!-- Header -->
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button class="nav-btn" id="navPrev">
                            <i data-lucide="chevron-left"></i>
                        </button>
                        <div class="calendar-title" id="calendarTitle"></div>
                        <button class="nav-btn" id="navNext">
                            <i data-lucide="chevron-right"></i>
                        </button>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="month">Month</button>
                        <button class="view-btn" data-view="week">Week</button>
                        <button class="view-btn" data-view="day">Day</button>
                    </div>
                </div>

                <!-- Content area -->
                <div class="calendar-content" id="calendarContent"></div>

                <!-- Events list (month view only) -->
                <div class="calendar-events" id="calendarEvents"></div>
            </div>
        </div>

        <!-- Right: Triage Panel -->
        <div id="triage-panel" class="panel panel-right hidden">
            <div class="panel-header">
                <h3>Triage</h3>
                <button class="panel-close" data-panel="triage">×</button>
            </div>
            <div id="triage-content">
                <!-- Triage sections render here -->
            </div>
        </div>
    </div>

    <!-- Dev Badge (Toggle) -->
    <div id="dev-badge" class="dev-badge">
        DEV
    </div>

    <!-- Dev Panel -->
    <div id="dev-panel" class="dev-panel">
        <div class="dev-panel-header">
            <h3>Developer Panel</h3>
            <button id="dev-panel-close" class="close-btn">×</button>
        </div>

        <div class="dev-panel-content">
            <!-- Response Inspector -->
            <div class="dev-section">
                <h4>Last Response</h4>
                <div id="response-inspector" class="response-inspector">
                    <div class="empty-state">No responses yet</div>
                </div>
            </div>

            <!-- Action Log -->
            <div class="dev-section">
                <div class="dev-section-header">
                    <h4>Action Log</h4>
                    <button id="clear-log-btn" class="dev-btn-small">Clear</button>
                </div>
                <div id="action-log-entries" class="action-log"></div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="quick-capture-btn" onclick="openQuickCapture()">
            <i data-lucide="pencil"></i>
            Quick Capture
        </button>
        <button id="plan-mode-btn" class="plan-mode-btn">
            <i data-lucide="calendar-check"></i>
            Plan something
        </button>
        <button class="new-event-btn" onclick="openNewEventModal()">
            <i data-lucide="plus"></i>
        </button>
    </div>

    <!-- Quick Capture Modal -->
    <div id="quickCaptureModal" class="modal">
        <div class="modal-content quick-capture-modal">
            <button class="modal-close" onclick="closeQuickCapture()">✕</button>

            <!-- Input Mode (default) -->
            <div id="quickCaptureInput" class="quick-capture-input-mode">
                <h2>Jot it down</h2>
                <textarea
                    id="quick-capture-input"
                    placeholder="Call mom tomorrow at 6pm..."
                    rows="3"
                ></textarea>
                <div class="quick-capture-actions">
                    <button onclick="submitQuickCapture()" class="btn-primary">
                        Add to Calendar
                    </button>
                </div>
            </div>

            <!-- Triage Mode (shown when clarification needed) -->
            <div id="quickCaptureTriage" class="quick-capture-triage-mode hidden">
                <!-- Dynamically populated -->
            </div>

            <!-- Preview Mode (shown for confirmation) -->
            <div id="quickCapturePreview" class="quick-capture-preview-mode hidden">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Event Detail Modal -->
    <div id="eventDetailModal" class="modal">
        <div class="modal-content event-modal">
            <!-- Header -->
            <div class="modal-header">
                <button class="close-btn" onclick="closeEventDetail()">
                    <i data-lucide="x"></i>
                </button>
                <button id="deleteEventBtn" class="delete-btn" onclick="confirmDeleteEvent()">
                    <i data-lucide="trash-2"></i>
                </button>
            </div>

            <!-- View Mode -->
            <div id="eventViewMode" class="event-mode">
                <h2 id="eventViewTitle" class="event-title"></h2>

                <div class="event-detail-row">
                    <i data-lucide="calendar"></i>
                    <span id="eventViewDate"></span>
                </div>

                <div class="event-detail-row">
                    <i data-lucide="clock"></i>
                    <span id="eventViewTime"></span>
                </div>

                <div class="event-notes-section">
                    <label>Notes</label>
                    <p id="eventViewNotes" class="event-notes-display"></p>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="enterEditMode()">
                        <i data-lucide="pencil"></i>
                        Edit
                    </button>
                </div>
            </div>

            <!-- Edit Mode -->
            <div id="eventEditMode" class="event-mode" style="display: none;">
                <div class="form-group">
                    <label for="eventEditTitle">Title</label>
                    <input type="text" id="eventEditTitle" class="form-input" placeholder="Event title" required>
                </div>

                <div class="form-group">
                    <label for="eventEditDate">Date</label>
                    <input type="date" id="eventEditDate" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="eventEditTime">Time</label>
                    <input type="time" id="eventEditTime" class="form-input">
                </div>

                <div class="form-group">
                    <label for="eventEditNotes">Notes</label>
                    <textarea id="eventEditNotes" class="form-input form-textarea" rows="3" placeholder="Add notes..."></textarea>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="exitEditMode()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveEventChanges()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content delete-confirm-modal">
            <h3>Delete Event?</h3>
            <p id="deleteConfirmText">Are you sure you want to delete this event?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteConfirm()">Cancel</button>
                <button class="btn btn-danger" onclick="executeDeleteEvent()">Delete</button>
            </div>
        </div>
    </div>

    <script type="module">
        import devPanel from '/dev-panel.js';

        // Initialize dev panel when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            devPanel.initDevPanel();
        });

        // Make dev panel available globally
        window.devPanelModule = devPanel;
    </script>
    <script type="module">
        import AuthState from './js/auth-state.js';
        import AuthUI from './js/auth-ui.js';
        import ChatUI from './js/triage-ui.js';
        import SettingsUI from './js/settings-ui.js';
        import HistoryUI from './js/history-ui.js';
        import TriageState from './js/triage-state.js';
        import PanelManager from './js/panel-manager.js';
        import CompactCalendar from './js/compact-calendar.js';
        import TriagePanel from './js/triage-panel.js';

        // Initialize panel manager first
        PanelManager.init();

        // Initialize triage panel
        TriagePanel.init();

        // Initialize auth
        await AuthState.init();
        AuthUI.init('auth-modal', 'auth-header');

        // Listen for auth changes
        AuthState.onAuthChange(async (event, user, previousUser) => {
            console.log('Auth event:', event, user?.email);

            if (event === 'SIGNED_IN') {
                // Claim anonymous conversations
                await TriageState.claimConversations();

                // Reload conversation to show claimed data
                if (ChatUI.isOpen()) {
                    await ChatUI.open();
                }
            } else if (event === 'SIGNED_OUT') {
                // Clear conversation
                if (ChatUI.isOpen()) {
                    ChatUI.close();
                }
            }
        });

        // Initialize UI
        ChatUI.init();
        SettingsUI.init('settings-container');
        HistoryUI.init('history-container');

        // Wire up buttons
        document.getElementById('plan-mode-btn')?.addEventListener('click', () => {
            PanelManager.open('chat');
            if (PanelManager.isOpen('chat')) {
                ChatUI.focus?.(); // Focus input when opening
            }
        });

        document.getElementById('profile-btn')?.addEventListener('click', () => {
            SettingsUI.open('profile');
        });

        // Make modules available globally
        window.HistoryUI = HistoryUI;
        window.SettingsUI = SettingsUI;
        window.PanelManager = PanelManager;
    </script>
    <script src="/app.js"></script>
</body>
</html>
