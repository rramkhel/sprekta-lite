<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprekta - AI Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Triage / Plan Mode Container -->
    <div id="triage-container" class="hidden"></div>

    <!-- Calendar View -->
    <div class="calendar-view app-container">
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <div class="month-year" id="monthYear"></div>
                    <button class="nav-btn" onclick="changeMonth(1)">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>
                <div class="header-actions">
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" id="monthViewBtn" onclick="switchView('month')">
                            <i data-lucide="calendar"></i>
                            Month
                        </button>
                        <button class="view-toggle-btn" id="dayViewBtn" onclick="switchView('day')">
                            <i data-lucide="clock"></i>
                            Day
                        </button>
                    </div>
                    <button class="clear-btn" onclick="clearCalendar()">
                        <i data-lucide="trash-2"></i>
                        Clear All
                    </button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="day-view-grid" id="dayViewGrid" style="display: none;"></div>
        </div>
    </div>

    <!-- Dev Badge (Toggle) -->
    <div id="dev-badge" class="dev-badge">
        DEV
    </div>

    <!-- Dev Panel -->
    <div id="dev-panel" class="dev-panel">
        <div class="dev-panel-header">
            <h3>Developer Panel</h3>
            <button id="dev-panel-close" class="close-btn">×</button>
        </div>

        <div class="dev-panel-content">
            <!-- Response Inspector -->
            <div class="dev-section">
                <h4>Last Response</h4>
                <div id="response-inspector" class="response-inspector">
                    <div class="empty-state">No responses yet</div>
                </div>
            </div>

            <!-- Action Log -->
            <div class="dev-section">
                <div class="dev-section-header">
                    <h4>Action Log</h4>
                    <button id="clear-log-btn" class="dev-btn-small">Clear</button>
                </div>
                <div id="action-log-entries" class="action-log"></div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="quick-capture-btn" onclick="openQuickCapture()">
            <i data-lucide="pencil"></i>
            Quick Capture
        </button>
        <button id="plan-mode-btn" class="plan-mode-btn">
            <i data-lucide="calendar-check"></i>
            Plan something
        </button>
        <button class="new-event-btn" onclick="openNewEventModal()">
            <i data-lucide="plus"></i>
        </button>
    </div>

    <!-- Quick Capture Modal -->
    <div class="modal" id="quickCaptureModal">
        <div class="modal-content" style="max-width: 500px;">
            <h3>Quick Capture</h3>
            <textarea
                id="quick-capture-input"
                placeholder="Type naturally: 'Call mom tomorrow at 6pm'"
                rows="3"
                style="width: 100%; padding: 8px; font-size: 14px; margin: 16px 0; border: 1px solid #ddd; border-radius: 4px;"
            ></textarea>
            <div style="margin-top: 12px; text-align: right;">
                <button onclick="closeQuickCapture()" style="margin-right: 8px; padding: 8px 16px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">Cancel</button>
                <button onclick="submitQuickCapture()" class="primary" style="padding: 8px 16px; background: #ea580c; color: white; border: none; border-radius: 4px; cursor: pointer;">Add</button>
            </div>
        </div>
    </div>

    <!-- Event Detail Modal -->
    <div id="eventDetailModal" class="modal">
        <div class="modal-content event-modal">
            <!-- Header -->
            <div class="modal-header">
                <button class="close-btn" onclick="closeEventDetail()">
                    <i data-lucide="x"></i>
                </button>
                <button id="deleteEventBtn" class="delete-btn" onclick="confirmDeleteEvent()">
                    <i data-lucide="trash-2"></i>
                </button>
            </div>

            <!-- View Mode -->
            <div id="eventViewMode" class="event-mode">
                <h2 id="eventViewTitle" class="event-title"></h2>

                <div class="event-detail-row">
                    <i data-lucide="calendar"></i>
                    <span id="eventViewDate"></span>
                </div>

                <div class="event-detail-row">
                    <i data-lucide="clock"></i>
                    <span id="eventViewTime"></span>
                </div>

                <div class="event-notes-section">
                    <label>Notes</label>
                    <p id="eventViewNotes" class="event-notes-display"></p>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="enterEditMode()">
                        <i data-lucide="pencil"></i>
                        Edit
                    </button>
                </div>
            </div>

            <!-- Edit Mode -->
            <div id="eventEditMode" class="event-mode" style="display: none;">
                <div class="form-group">
                    <label for="eventEditTitle">Title</label>
                    <input type="text" id="eventEditTitle" class="form-input" placeholder="Event title" required>
                </div>

                <div class="form-group">
                    <label for="eventEditDate">Date</label>
                    <input type="date" id="eventEditDate" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="eventEditTime">Time</label>
                    <input type="time" id="eventEditTime" class="form-input">
                </div>

                <div class="form-group">
                    <label for="eventEditNotes">Notes</label>
                    <textarea id="eventEditNotes" class="form-input form-textarea" rows="3" placeholder="Add notes..."></textarea>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="exitEditMode()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveEventChanges()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content delete-confirm-modal">
            <h3>Delete Event?</h3>
            <p id="deleteConfirmText">Are you sure you want to delete this event?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteConfirm()">Cancel</button>
                <button class="btn btn-danger" onclick="executeDeleteEvent()">Delete</button>
            </div>
        </div>
    </div>

    <script type="module">
        import devPanel from '/dev-panel.js';

        // Initialize dev panel when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            devPanel.initDevPanel();
        });

        // Make dev panel available globally
        window.devPanelModule = devPanel;
    </script>
    <script type="module">
        import TriageUI from './js/triage-ui.js';

        // Initialize Plan Mode
        TriageUI.init('triage-container');

        // Wire up button
        document.getElementById('plan-mode-btn')?.addEventListener('click', () => {
            TriageUI.open();
        });
    </script>
    <script src="/app.js"></script>
</body>
</html>
