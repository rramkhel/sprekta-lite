<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprekta - AI Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Calendar View -->
    <div class="calendar-view">
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <div class="month-year" id="monthYear"></div>
                    <button class="nav-btn" onclick="changeMonth(1)">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>
                <button class="clear-btn" onclick="clearCalendar()">
                    <i data-lucide="trash-2"></i>
                    Clear All
                </button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- Dev Badge (Toggle) -->
    <div id="dev-badge" class="dev-badge">
        DEV
    </div>

    <!-- Dev Panel -->
    <div id="dev-panel" class="dev-panel">
        <div class="dev-panel-header">
            <h3>Developer Panel</h3>
            <button id="dev-panel-close" class="close-btn">×</button>
        </div>

        <div class="dev-panel-content">
            <!-- Demo Mode Toggle -->
            <div class="dev-section">
                <label class="dev-toggle-label">
                    <input type="checkbox" id="demo-mode-toggle">
                    <span>Demo Mode (Mock AI)</span>
                </label>
            </div>

            <!-- Test Scenarios -->
            <div id="scenario-controls" class="dev-section" style="display: none;">
                <h4>Test Scenarios</h4>
                <select id="scenario-select" class="dev-select">
                    <option value="">-- Select a scenario --</option>
                </select>
                <button id="load-scenario-btn" class="dev-btn">Load into Quick Capture</button>
                <div id="scenario-preview" class="scenario-preview"></div>
            </div>

            <!-- Response Inspector -->
            <div class="dev-section">
                <h4>Last Response</h4>
                <div id="response-inspector" class="response-inspector">
                    <div class="empty-state">No responses yet</div>
                </div>
            </div>

            <!-- Action Log -->
            <div class="dev-section">
                <div class="dev-section-header">
                    <h4>Action Log</h4>
                    <button id="clear-log-btn" class="dev-btn-small">Clear</button>
                </div>
                <div id="action-log-entries" class="action-log"></div>
            </div>
        </div>
    </div>

    <!-- Quick Capture Button -->
    <button class="quick-capture-btn" onclick="openQuickCapture()">
        <i data-lucide="pencil"></i>
        Quick Capture
    </button>

    <!-- Quick Capture Modal -->
    <div class="modal" id="quickCaptureModal">
        <div class="modal-content" style="max-width: 500px;">
            <h3>Quick Capture</h3>
            <textarea
                id="quick-capture-input"
                placeholder="Type naturally: 'Call mom tomorrow at 6pm'"
                rows="3"
                style="width: 100%; padding: 8px; font-size: 14px; margin: 16px 0; border: 1px solid #ddd; border-radius: 4px;"
            ></textarea>
            <div style="margin-top: 12px; text-align: right;">
                <button onclick="closeQuickCapture()" style="margin-right: 8px; padding: 8px 16px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">Cancel</button>
                <button onclick="submitQuickCapture()" class="primary" style="padding: 8px 16px; background: #ea580c; color: white; border: none; border-radius: 4px; cursor: pointer;">Add</button>
            </div>
        </div>
    </div>

    <script type="module">
        import devPanel from '/dev-panel.js';

        // Initialize dev panel when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            devPanel.initDevPanel();
            devPanel.populateScenarioSelector();
        });

        // Make dev panel available globally
        window.devPanelModule = devPanel;
    </script>
    <script src="/app.js"></script>
</body>
</html>
