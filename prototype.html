<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprekta Prototype - Scenario Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            color: #292524;
            overflow: hidden;
        }

        .prototype-container {
            display: grid;
            grid-template-columns: 300px 1fr 400px;
            height: 100vh;
            gap: 0;
        }

        /* Left Panel - Scenario List */
        .scenarios-panel {
            background: #fff;
            border-right: 1px solid #e7e5e4;
            overflow-y: auto;
            padding: 20px;
        }

        .scenarios-panel h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #292524;
        }

        .scenario-category {
            margin-bottom: 24px;
        }

        .category-header {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #78716c;
            margin-bottom: 8px;
            padding: 4px 8px;
            background: #f5f5f4;
            border-radius: 4px;
        }

        .scenario-item {
            padding: 12px;
            margin-bottom: 4px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .scenario-item:hover {
            background: #fafaf9;
            border-color: #e7e5e4;
        }

        .scenario-item.active {
            background: #fff7ed;
            border-color: #fdba74;
        }

        .scenario-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .scenario-preview {
            font-size: 12px;
            color: #78716c;
            font-style: italic;
        }

        /* Center Panel - UI Preview */
        .ui-panel {
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .ui-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e7e5e4;
            background: #fafaf9;
        }

        .ui-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .ui-header .status {
            font-size: 14px;
            color: #78716c;
        }

        .ui-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .ui-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #a8a29e;
            font-size: 16px;
        }

        /* Right Panel - Debug Info */
        .debug-panel {
            background: #292524;
            color: #fafaf9;
            overflow-y: auto;
            padding: 20px;
        }

        .debug-panel h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fdba74;
        }

        .debug-section {
            margin-bottom: 24px;
        }

        .debug-label {
            font-size: 12px;
            color: #a8a29e;
            margin-bottom: 4px;
        }

        .debug-value {
            font-size: 13px;
            background: #1c1917;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .json-viewer {
            background: #1c1917;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            font-family: 'Monaco', 'Courier New', monospace;
            line-height: 1.6;
        }

        .json-key {
            color: #93c5fd;
        }

        .json-string {
            color: #86efac;
        }

        .json-number {
            color: #fca5a5;
        }

        .json-boolean {
            color: #fdba74;
        }

        .edit-response-btn {
            width: 100%;
            padding: 10px;
            background: #ea580c;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .edit-response-btn:hover {
            background: #dc2626;
        }

        /* Mock UI Components */
        .mock-quick-capture {
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .mock-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e7e5e4;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 16px;
            font-family: inherit;
        }

        .mock-input:focus {
            outline: none;
            border-color: #ea580c;
        }

        .mock-response {
            margin-top: 20px;
            padding: 16px;
            background: #fafaf9;
            border-radius: 6px;
        }

        .response-action {
            font-size: 12px;
            font-weight: 600;
            color: #ea580c;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .response-message {
            font-size: 14px;
            margin-bottom: 16px;
            color: #292524;
        }

        .response-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .response-btn {
            padding: 8px 16px;
            border: 1px solid #e7e5e4;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .response-btn.primary {
            background: #ea580c;
            color: #fff;
            border-color: #ea580c;
        }

        .response-btn:hover {
            border-color: #ea580c;
        }

        .response-btn.primary:hover {
            background: #dc2626;
        }

        .event-preview {
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 6px;
            padding: 16px;
            margin-top: 12px;
        }

        .event-field {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .event-label {
            font-weight: 500;
            color: #78716c;
            min-width: 80px;
        }

        .event-value {
            color: #292524;
        }

        .confidence-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .confidence-high {
            background: #dcfce7;
            color: #166534;
        }

        .confidence-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .confidence-low {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-log {
            background: #f5f5f4;
            padding: 12px;
            border-radius: 6px;
            margin-top: 16px;
        }

        .log-header {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #78716c;
        }

        .log-entry {
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #e7e5e4;
            color: #292524;
        }

        .log-entry:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="prototype-container">
        <!-- Left Panel: Scenarios -->
        <div class="scenarios-panel">
            <h2>📋 Test Scenarios</h2>
            <div id="scenarios-list"></div>
        </div>

        <!-- Center Panel: UI Preview -->
        <div class="ui-panel">
            <div class="ui-header">
                <h1>Sprekta Prototype</h1>
                <div class="status">
                    <span id="current-scenario-name">Select a scenario to begin</span>
                </div>
            </div>
            <div class="ui-content">
                <div id="ui-preview" class="ui-placeholder">
                    👈 Select a scenario from the left panel
                </div>
            </div>
        </div>

        <!-- Right Panel: Debug Info -->
        <div class="debug-panel">
            <h3>🔍 Debug Info</h3>
            <div id="debug-info">
                <div class="debug-value">No scenario loaded</div>
            </div>
        </div>
    </div>

    <script type="module" src="/prototype.js"></script>
</body>
</html>
